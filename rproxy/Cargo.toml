[package]
name = "rproxy"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["full"] }

# Level 8 (Security & TLS). The one place this course stops writing from
# scratch: hand-rolling crypto or certificate parsing is the level's named
# mistake #1. `ring` is pinned as the crypto provider instead of the
# `aws-lc-rs` default — it builds far lighter and needs no cmake/NASM.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
